// Hold sbt at 1.x. The sbt plugins these builds use (for example sbt-typelevel)
// don't publish for sbt 2 yet, and sbt 2 needs JDK 17 while these builds' CI
// matrices include JDK 8. Newer 1.x releases still come through.
//
// A repository that is ready for sbt 2 can lift the hold by pinning
// org.scala-sbt:sbt to "2." in its own .scala-steward.conf; Steward lets a
// repository's pin for the same groupId and artifactId replace this default.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." },

  // Hold scala-library at 2.x. Scala Steward is meant never to propose
  // scala-library 2.13 -> 3.x, but that guard is skipped whenever a newer 2.13
  // pre-release exists (for example 2.13.19-M1), and it then proposed 3.10.0.
  // Newer 2.x releases still come through. Scala 3 version updates go through
  // scala3-library and scala3-compiler, so they aren't affected.
  //
  // A repository that genuinely needs scala-library 3.x can pin
  // org.scala-lang:scala-library to "3." in its own .scala-steward.conf (a
  // repository's pin replaces this default). Remove this pin once Steward fixes
  // the guard.
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2." }
]
