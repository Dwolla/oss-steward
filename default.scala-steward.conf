// Hold sbt at 1.x. The sbt plugins these builds use (for example sbt-typelevel)
// don't publish for sbt 2 yet, and sbt 2 needs JDK 17 while these builds' CI
// matrices include JDK 8. Newer 1.x releases still come through.
//
// A repository that is ready for sbt 2 can lift the hold by pinning
// org.scala-sbt:sbt to "2." in its own .scala-steward.conf; Steward lets a
// repository's pin for the same groupId and artifactId replace this default.
updates.pin = [ { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." } ]
